<script>
    // === CONFIGURACIÓN DE SUPABASE ===
    const SUPABASE_URL = 'https://iiesuerlrtutlldnbjxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HShjI19W_rB6j9MpnPahaQ_hn6TthF3';

    // Datos de demostración (se usarán si falla Supabase o si no hay datos)
    const DEMO_DATA = [
        { title: "Veterinaria San Martín", category: "veterinaria", description: "Atención 24h, consultas, vacunas", phone: "593987654321", location: "Av. Solano, Cuenca" },
        { title: "Snacks Kukipet", category: "snacks", description: "Galletas naturales sin conservantes", phone: "593988776655", location: "Cuenca - Envíos a domicilio" },
        { title: "Pet Shop Mascota Feliz", category: "pet shop", description: "Alimentos y accesorios", phone: "593987123456", location: "Calle Larga, Cuenca" }
    ];

    let allListings = [];

    async function loadListings() {
        try {
            // Crear cliente de Supabase (sin redeclarar la variable global)
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data, error } = await supabaseClient
                .from('listings')
                .select('*')
                .eq('published', true)
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            
            if (data && data.length > 0) {
                allListings = data;
            } else {
                // Si no hay datos en Supabase, usar demostración
                allListings = DEMO_DATA.map(item => ({ ...item, id: Math.random() }));
                console.log('Usando datos de demostración (sin datos en Supabase)');
            }
        } catch(err) {
            console.warn('Error conectando a Supabase:', err.message);
            // Usar datos de demostración en caso de error de conexión
            allListings = DEMO_DATA.map(item => ({ ...item, id: Math.random() }));
        }
        renderListings(allListings);
    }

    function renderListings(items) {
        const container = document.getElementById('listingsGrid');
        if (!items.length) {
            container.innerHTML = '<p style="text-align:center;">No hay servicios disponibles. Agrega listados desde Supabase.</p>';
            return;
        }
        container.innerHTML = items.map(item => `
            <div class="card">
                <div class="card-img">🐾</div>
                <div class="card-content">
                    <div class="card-category">${escapeHtml(item.category || 'Servicio')}</div>
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    <div class="card-desc">${escapeHtml(item.description || 'Sin descripción')}</div>
                    <div class="card-desc">📍 ${escapeHtml(item.location || item.address || 'Cuenca')}</div>
                    <a href="https://wa.me/${(item.phone || '').replace(/\D/g,'')}?text=Hola%2C%20vi%20tu%20servicio%20en%20Kukipet%20y%20me%20interesa" target="_blank" class="whatsapp-btn">📱 Contactar por WhatsApp</a>
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(str) { 
        if(!str) return ''; 
        return str.replace(/[&<>]/g, function(m){ 
            if(m==='&') return '&amp;'; 
            if(m==='<') return '&lt;'; 
            if(m==='>') return '&gt;'; 
            return m;
        }); 
    }

    function filterListings() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const activeFilter = document.querySelector('.filter-btn.active').dataset.category;
        let filtered = allListings;
        if (activeFilter !== 'all') {
            filtered = filtered.filter(l => (l.category || '').toLowerCase() === activeFilter.toLowerCase());
        }
        if (searchTerm) {
            filtered = filtered.filter(l => (l.title || '').toLowerCase().includes(searchTerm) || (l.description || '').toLowerCase().includes(searchTerm));
        }
        renderListings(filtered);
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', filterListings);
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterListings();
        });
    });

    // Iniciar
    loadListings();
</script>
